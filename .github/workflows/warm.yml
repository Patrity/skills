name: warm

# Vercel's GitHub integration posts a deployment_status for every deploy. A deploy rebuilds
# the app, so every ISR entry is cold again: warm them before a real visitor pays for it.
on:
  deployment_status:
  workflow_dispatch:

# Two deploys in quick succession would otherwise warm the older build's URLs on top of the
# newer one. Only the latest run matters.
concurrency:
  group: warm
  cancel-in-progress: true

jobs:
  warm:
    # Verified against repos/Patrity/skills/deployments: Vercel names the environment
    # "Production" (and leaves `production_environment` false, so don't match on that).
    # `environment_url` is the per-deploy *.vercel.app host, never vars.SITE_URL.
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Show the deployment payload
        if: github.event_name == 'deployment_status'
        env:
          DEPLOYMENT: ${{ toJSON(github.event.deployment) }}
        run: echo "$DEPLOYMENT"

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # --ignore-scripts skips `nuxt prepare`: warm-cache.sh only needs tsx.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # deployment_status fires before the alias necessarily points at the new build, and the
      # payload URLs are keyed by build id: warming too early fills entries for the build that
      # is on its way out. The per-deployment *.vercel.app URL sits behind Vercel's deployment
      # protection (302), so it cannot be asked for its build id. Instead compare the live
      # build's timestamp (written at build time) with this deployment's creation time: once
      # the site serves a build newer than the deployment was created, it is this one (or a
      # later one, which is equally fine to warm).
      - name: Wait for the site to serve this deployment
        if: github.event_name == 'deployment_status'
        env:
          CREATED_AT: ${{ github.event.deployment.created_at }}
        run: |
          set -euo pipefail
          target=$(date -u -d "$CREATED_AT" +%s)
          echo "deployment created at $CREATED_AT ($target)"
          for i in $(seq 1 24); do
            live_ms=$(curl -fsS --max-time 30 "$SITE_URL/_nuxt/builds/latest.json" | jq -r '.timestamp // 0' || echo 0)
            live=$(( live_ms / 1000 ))
            if [ "$live" -ge "$target" ]; then echo "site serving a build from $(date -u -d @$live +%FT%TZ)"; exit 0; fi
            echo "attempt $i: site still serving a build from $(date -u -d @$live +%FT%TZ)"
            sleep 5
          done
          echo "site never picked up the new build"
          exit 1

      - name: Warm caches
        run: bash scripts/warm-cache.sh "$SITE_URL"
