name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate bundles
        run: pnpm validate:skills

      - run: pnpm lint

      - run: pnpm typecheck

      # Two separate Nitro builds, and that's intentional: `pnpm test` (@nuxt/test-utils)
      # builds into its own throwaway .nuxt/test/<id>/output against the fixture bundles
      # under test/fixtures/skills with a test-only runtimeConfig (revalidateSecret,
      # skillsDir), then discards it; `pnpm build` below produces the real .output that
      # would actually ship, against the real skills/ dir. Reusing one for the other
      # (`setup({ build: false })` pointed at `.output`) would mean the e2e suite no
      # longer builds anything itself — contradicting the documented, self-contained
      # `pnpm test` contract (CLAUDE.md) — and would need `pnpm build` to run first.
      - name: Unit + route tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          SKILLS_SOURCE: fs
